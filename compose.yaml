name: catch-catch-local

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD:?Run compose.py init}@postgres:5432/langfuse
  NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3210}
  SALT: ${LANGFUSE_SALT:?Run compose.py init}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Run compose.py init}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run compose.py init}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD:?Run compose.py init}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Run compose.py init}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Run compose.py init}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  TELEMETRY_ENABLED: "false"
  NODE_OPTIONS: --max-old-space-size=512

x-langfuse-deps: &langfuse-deps
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-3200}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/backend/health]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - path: ./.local/compose/backend.env
        format: raw
    environment:
      DATABASE_PATH: /app/data/generated/customer_signal.duckdb
      ARTIFACT_DIRECTORY: /app/data/run-artifacts
      ONBOARDED_SOURCES_DIR: /app/data/onboarded-sources
      API_HOST: 127.0.0.1
      API_PORT: "8000"
      FRONTEND_ORIGIN: ${APP_URL:-http://localhost:3200}
    volumes:
      - app-data:/app/data
    depends_on:
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/backend/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  langfuse-web:
    # Pin the existing v3 integration to immutable images; upgrade both together.
    image: langfuse/langfuse:3@sha256:018a38c957d8cb51094bd28154a8cb0b0fb587e5bf4e00df75602b7ebe7933fa
    depends_on: *langfuse-deps
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3210}:3000"
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
      # Full investigation traces exceed the shared 512 MiB worker heap.
      NODE_OPTIONS: --max-old-space-size=1536
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run compose.py init}
      LANGFUSE_INIT_ORG_ID: catch-catch
      LANGFUSE_INIT_ORG_NAME: Catch Catch Local
      LANGFUSE_INIT_PROJECT_ID: catch-catch-local
      LANGFUSE_INIT_PROJECT_NAME: Catch Catch Local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run compose.py init}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run compose.py init}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:-admin@catch-catch.local}
      LANGFUSE_INIT_USER_NAME: Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:?Run compose.py init}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${MINIO_URL:-http://localhost:3290}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3@sha256:0e7a6d86db72e804f8422af2b15d9b443aa67d33a5193941ddf7b5babd4fd518
    depends_on: *langfuse-deps
    environment: *langfuse-env
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run compose.py init}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run compose.py init}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./deploy/clickhouse.xml:/etc/clickhouse-server/config.d/local-memory.xml:ro
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null "http://$$(hostname -i):8123/ping"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run compose.py init}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDISCLI_AUTH" --appendonly yes --maxmemory-policy noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    entrypoint: [sh, -c]
    command: ['mkdir -p /data/langfuse && exec minio server --address ":9000" /data']
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run compose.py init}
    ports:
      - "127.0.0.1:${MINIO_PORT:-3290}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  minio-data:
